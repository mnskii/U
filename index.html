<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U — Encontre quem importa</title><style> *{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f3f5f7;color:#17232d}header,nav{background:#fff;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}header{position:sticky;top:0;z-index:10}header b{font-size:32px}main{max-width:720px;margin:auto;padding:16px 16px 100px}nav{position:fixed;bottom:0;width:100%;z-index:10;justify-content:space-around;padding-bottom:calc(12px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit;border-radius:12px;padding:12px;border:1px solid #ccd3d8}button{background:#17232d;color:white;cursor:pointer}nav button{background:white;color:#17232d;border:0;padding:8px;font-size:13px}section{background:white;padding:18px;border-radius:20px;margin:12px 0}input,select,textarea{width:100%;margin:6px 0}label{display:block;margin-top:12px}small{color:#586875}h2{margin-top:0}#map{height:340px;border-radius:16px;background:#dce7df;overflow:hidden}img.avatar{width:70px;height:70px;object-fit:cover;border-radius:50%}.item{border-top:1px solid #ddd;padding:12px 0}.pill{background:#e8edf0;padding:6px 10px;border-radius:20px;font-size:12px}a{color:#175a80}</style><header><b>U</b><span>Encontre quem importa.</span><span class="pill">Modo teste</span></header><main id="main"></main><nav><button onclick="show('map')">⌖ Mapa</button><button onclick="show('people')">♧ Pessoas</button><button onclick="show('events')">▣ Eventos</button><button onclick="show('groups')">▦ Grupos</button><button onclick="show('profile')">● Perfil</button></nav><script>
const $=id=>document.getElementById(id), load=(k,d)=>{try{return JSON.parse(localStorage.getItem('u:'+k))??d}catch{return d}}, save=(k,v)=>localStorage.setItem('u:'+k,JSON.stringify(v)), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let profile=load('profile',{}), tab='map',photo=profile.photo||'', position=null;const fields=[['name','Nome'],['handle','@usuário'],['city','Cidade'],['job','Profissão'],['bio','Biografia'],['interests','Interesses'],['languages','Idiomas'],['social','Redes sociais']];function show(t){tab=t;let h='';if(t==='map')h=`<h2>Mapa</h2><section><p>Seu GPS é exibido apenas neste dispositivo nesta versão.</p><button onclick="locate()">Minha localização</button><p id="status">Localização desativada</p><div id="map"><p style="padding:20px">Ative o GPS para visualizar sua posição.</p></div></section><section><h3>Privacidade</h3><p>Compartilhamento com outras pessoas indisponível no modo teste.</p><button onclick="show('profile')">Configurar perfil</button></section>`;if(t==='profile')h=`<h2>Meu perfil</h2><section>${photo?`<img class="avatar" src="${esc(photo)}">`:''}<label>Foto<input type="file" accept="image/*" onchange="readPhoto(this)"></label><form onsubmit="storeProfile(event)">${fields.map(([k,n])=>`<label>${n}<input name="${k}" value="${esc(profile[k])}" ${k==='name'||k==='handle'?'required':''}><select name="${k}_visibility">${['Somente eu','Amigos','Público'].map(v=>`<option ${v===(profile[k+'_visibility']||'Somente eu')?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}<label>Localização<select name="location"><option>Invisível</option><option ${profile.location==='Aproximada'?'selected':''}>Aproximada</option><option ${profile.location==='Amigos autorizados'?'selected':''}>Amigos autorizados</option></select></label><button>Salvar perfil</button></form></section>`;if(t==='people')h=`<h2>Pessoas</h2><section><label>Buscar por nome ou @<input id="search" oninput="filterPeople()" placeholder="@usuario"></label><div id="results"></div><p><small>Busca local de contatos de teste. Nenhum usuário real é rastreado.</small></p><form onsubmit="addPerson(event)"><input name="name" required placeholder="Nome"><input name="handle" required placeholder="@usuário"><button>Adicionar contato local</button></form></section>`;if(t==='events'||t==='groups'){let e=t==='events';h=`<h2>${e?'Eventos':'Corporações'}</h2><section><form onsubmit="addGroup(event)"><label>Nome<input name="name" required placeholder="${e?'Festa da Uva':'Nome da corporação'}"></label><label>Descrição<textarea name="description"></textarea></label>${e?'<label>Início<input name="start" type="datetime-local" required></label><label>Fim<input name="end" type="datetime-local" required></label>':''}<label>Foto ou logotipo<input name="image" type="file" accept="image/*"></label><button>Criar ${e?'evento':'corporação'}</button></form></section>${load(t,[]).map((g,i)=>`<section>${g.image?`<img class="avatar" src="${esc(g.image)}">`:''}<h3>${esc(g.name)}</h3><p>${esc(g.description)}</p>${e?`<small>${esc(g.start)} — ${esc(g.end)}</small>`:''}<p>Participantes: ${g.members.map(esc).join(', ')||'Nenhum'}</p><form onsubmit="invite(event,${i})"><input name="member" required placeholder="@usuário"><button>Adicionar à lista local</button></form><small>Convites reais e localização compartilhada ainda não conectados.</small></section>`).join('')}`;} $('main').innerHTML=h;if(t==='people')filterPeople();if(t==='map'&&position)renderMap();}function readPhoto(el){let f=el.files[0];if(f&&f.size<2000000){let r=new FileReader();r.onload=()=>{photo=r.result;};r.readAsDataURL(f)}else alert('Escolha uma imagem de até 2 MB.')}function storeProfile(e){e.preventDefault();profile={...Object.fromEntries(new FormData(e.target)),photo};try{save('profile',profile);alert('Perfil salvo neste dispositivo.');show('profile')}catch{alert('Armazenamento cheio.')}}function addPerson(e){e.preventDefault();let p=Object.fromEntries(new FormData(e.target));let a=load('people',[]);a.push(p);save('people',a);show('people')}function filterPeople(){let q=$('search').value.toLowerCase();$('results').innerHTML=load('people',[]).filter(p=>(p.name+' '+p.handle).toLowerCase().includes(q)).map(p=>`<div class="item"><b>${esc(p.name)}</b> ${esc(p.handle)}<br><small>Contato local · localização não disponível</small></div>`).join('')||'<p>Nenhum contato encontrado.</p>'}async function addGroup(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.end&&d.end<=d.start)return alert('O fim deve ser posterior ao início.');let f=d.image;d.image='';if(f.size){if(f.size>2000000)return alert('Imagem de até 2 MB.');d.image=await new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}d.members=[];let a=load(tab,[]);a.push(d);try{save(tab,a);show(tab)}catch{alert('Armazenamento cheio.')}}function invite(e,i){e.preventDefault();let a=load(tab,[]);let m=new FormData(e.target).get('member');if(!a[i].members.includes(m))a[i].members.push(m);save(tab,a);show(tab)}function locate(){if(!navigator.geolocation)return alert('GPS indisponível');$('status').textContent='Solicitando autorização…';navigator.geolocation.getCurrentPosition(p=>{position=p.coords;if(tab==='map')renderMap()},e=>{if($('status'))$('status').textContent='Não foi possível obter a localização: '+e.message},{enableHighAccuracy:true,timeout:15000})}function renderMap(){let {latitude:a,longitude:b,accuracy:c}=position;$('status').textContent='GPS ativo · precisão aproximada '+Math.round(c)+' m';let bbox=[b-.01,a-.007,b+.01,a+.007].join(',');$('map').innerHTML=`<iframe title="Mapa da sua localização" width="100%" height="100%" style="border:0" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${a}%2C${b}"></iframe>`}show('map');</script></html>
